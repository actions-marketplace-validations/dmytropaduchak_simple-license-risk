name: Simple License Risk
description: Warn when lockfiles introduce copyleft licenses such as GPL or AGPL.
author: Dmytro Paduchak
branding:
  icon: book
  color: blue
inputs:
  github-token:
    description: Token used to post sticky PR comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail the job when findings match that severity."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
